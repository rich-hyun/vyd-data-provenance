      <div class="panel-h"><h3>온체인 앵커 (AuditLogAnchored)</h3><p>API 서버가 감사 로그 ${ANCHOR_SIZE}건마다 머클 루트를 기록합니다.</p></div>
      <div class="tbl-wrap" id="an-table"></div>
    </section>
    <section class="panel">
      <div class="panel-h"><h3>API 서버 감사 로그</h3><button type="button" class="btn ghost sm" id="srv-refresh" ${SET.api?'':'disabled'}>새로고침</button></div>
      <div class="tbl-wrap" id="srv-table">${SET.api?'<div class="note"><span class="spinner"></span> 불러오는 중…</div>':`<div class="empty">API 서버 주소가 없어 서버 로그를 불러올 수 없습니다. ${goBtn('view:wallet','연결 설정','lnk')}에서 API 서버 URL과 키를 입력하세요.</div>`}</div>
    </section>` : `
    <section class="panel">
      <div class="panel-h"><h3>온체인 앵커</h3><span class="small muted" id="an-next"></span></div>
      <div class="tbl-wrap" id="an-table"></div>
    </section>`;
    return `${modeBanner()}
    <div class="intro"><p>등록·조회·검증·관제 이벤트를 모두 기록합니다. 로그 ${ANCHOR_SIZE}건마다 머클 루트를 계산해 컨트랙트의 <code>anchorAuditLog</code>로 온체인에 고정하므로, 이후 로그가 수정되면 재검증에서 바로 드러납니다.</p></div>
    ${liveTop}
    <section class="panel">
      <div class="panel-h"><h3>${isLive()?'이 콘솔 작업 기록 (브라우저)':'로그'}</h3>
        <div class="row">
          <select id="au-type" aria-label="유형 필터" style="width:auto"><option value="">전체 유형</option>${Object.entries(AUDIT_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
          <input type="search" id="au-q" placeholder="주체·대상 검색" aria-label="로그 검색" style="width:180px">
          <button class="btn ghost sm" type="button" id="au-csv">CSV 복사</button>
        </div></div>
      <div class="tbl-wrap" id="au-table"></div>
    </section>`;
  },
  mount(){
    $('#au-type').value=S.auditFilter.type; $('#au-q').value=S.auditFilter.q;
    $('#au-type').onchange=e=>{S.auditFilter.type=e.target.value;this.table()};
    $('#au-q').oninput=e=>{S.auditFilter.q=e.target.value;this.table()};
    $('#au-csv').onclick=()=>{
      const rows=[['seq','time','type','actor','action','target','result','tx']].concat(this.filtered().map(a=>[a.seq,fmtDT(a.time),a.type,a.actor,a.action,a.target,a.result,a.tx||'']));
      copyText(rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'));
    };
    const sr=$('#srv-refresh'); if (sr) sr.onclick=()=>this.serverLogs();
    if (isLive() && SET.api) this.serverLogs();
    this.live(true);
  },
  live(force){ if(force || this._rev!==S.rev){ this._rev=S.rev; this.table(); this.anchors(); } },
  async serverLogs(){
    const el=$('#srv-table'); if(!el) return;
    try {
      const r=await realApi('GET','/audit-logs?limit=50');
      if (r.status!==200) throw new Error(r.body?.error?.message||('HTTP '+r.status));
      setHTML(el, r.body.items.length ? `<table><thead><tr><th class="num">#</th><th>시각</th><th>유형</th><th>클라이언트</th><th>행위</th><th>대상</th><th>결과</th><th>Tx</th></tr></thead><tbody>
        ${r.body.items.map(a=>`<tr><td class="num mono">${a.seq}</td><td class="muted small">${fmtDT(a.ts)}</td><td><span class="chip">${AUDIT_TYPES[a.type]||a.type}</span></td><td class="small">${esc(a.actor)}</td><td class="small"><code>${esc(a.action)}</code></td><td class="small">${esc(a.target)}</td><td class="small">${esc(a.result)}</td><td>${a.tx?txLink(a.tx.toLowerCase()):'—'}</td></tr>`).join('')}</tbody></table><p class="small muted">전체 ${fmt(r.body.total)}건 중 최근 50건</p>` : '<div class="empty">서버 로그가 아직 없습니다.</div>');
    } catch(e){ setHTML(el, `<div class="err">서버 로그를 불러오지 못했습니다: ${esc(e.message)}</div>`); }
  },
  filtered(){ const {type,q}=S.auditFilter; const s=q.trim().toLowerCase(); return S.audit.filter(a=>(!type||a.type===type)&&(!s||(a.actor+' '+a.target+' '+a.action).toLowerCase().includes(s))).slice().reverse(); },
  table(){
    const list=this.filtered(); const sa=STORES.sim.anchors; const lastTo=sa.length?sa[sa.length-1].toSeq:0;
    setHTML($('#au-table'), `<table><thead><tr><th class="num">#</th><th>시각</th><th>유형</th><th>주체</th><th>행위</th><th>대상</th><th>결과</th><th>Tx</th>${isLive()?'':'<th>앵커</th>'}</tr></thead><tbody>
      ${list.slice(0,80).map(a=>`<tr><td class="num mono">${a.seq}</td><td class="muted small" style="white-space:nowrap">${fmtDT(a.time)}</td><td><span class="chip">${AUDIT_TYPES[a.type]||a.type}</span></td><td class="small">${esc(a.actor)}</td><td class="small"><code>${esc(a.action)}</code></td><td class="small">${esc(a.target)}</td><td class="small">${esc(a.result)}</td><td>${a.tx?txLink(a.tx):'—'}</td>${isLive()?'':`<td>${a.seq<=lastTo?'<span class="chip ok">고정</span>':'<span class="chip">대기</span>'}</td>`}</tr>`).join('')||'<tr><td colspan="9" class="muted">조건에 맞는 로그가 없습니다.</td></tr>'}
    </tbody></table>${list.length>80?`<p class="small muted">최근 80건만 표시 (전체 ${list.length}건)</p>`:''}${isLive()?'<p class="small muted">이 표는 이 브라우저에서 한 작업만 담습니다. 공식 감사 로그는 API 서버가 보관하고 온체인에 앵커링합니다.</p>':''}`);
  },
  anchors(){
    const el=$('#an-table'); if(!el) return;
    if (!isLive()){ const lastTo=S.anchors.length?S.anchors[S.anchors.length-1].toSeq:0; const nx=$('#an-next'); if(nx) nx.textContent=`다음 앵커까지 ${ANCHOR_SIZE-(S.audit.length-lastTo)}건`; }
    const list=S.anchors.slice().reverse();
    setHTML(el, list.length ? `<table><thead><tr><th>#</th><th>로그 범위</th><th>머클 루트</th><th>블록</th><th>트랜잭션</th><th>재검증</th></tr></thead><tbody>
      ${list.map(a=>`<tr><td class="mono">${a.id}</td><td class="mono">#${a.fromSeq}–#${a.toSeq}</td><td class="mono">${short(a.root,8,6)}</td><td>${blkLink(a.block)}</td><td>${txLink(a.txHash)}</td><td><button class="btn ghost sm" type="button" data-anchor="${a.id}" ${isLive()&&!SET.api?'disabled title="API 서버 필요"':''}>무결성 검증</button> <span id="an-r-${a.id}"></span></td></tr>`).join('')}
    </tbody></table>` : `<div class="empty">${isLive()?'아직 온체인 앵커가 없습니다. API 서버가 감사 로그를 쌓으면 자동으로 기록됩니다.':'앵커 없음'}</div>`);
    $$('[data-anchor]').forEach(b=>b.onclick=async()=>{
      const a=S.anchors.find(x=>x.id===+b.dataset.anchor); const out=$('#an-r-'+a.id);
      try {
        let entries;
        if (isLive()){
          const r=await realApi('GET',`/audit-logs?fromSeq=${a.fromSeq}&limit=${a.toSeq-a.fromSeq+1}`);
          if (r.status!==200) throw new Error(r.body?.error?.message||('HTTP '+r.status));
          entries=r.body.items;
          if (entries.length!==a.toSeq-a.fromSeq+1) throw new Error('서버에 해당 범위 로그가 모두 있지 않습니다');
        } else entries=S.audit.slice(a.fromSeq-1,a.toSeq);
        const root=await merkleRoot(entries);
        out.innerHTML = root===a.root ? '<span class="chip ok">일치 · 변조 없음</span>' : '<span class="chip crit">불일치 · 변조 의심</span>';
      } catch(e){ out.innerHTML=`<span class="chip crit">${esc(e.message)}</span>`; }
    });
  }
};

/* =========================================================
   7. 라우터 · 헤더
   ========================================================= */
let cur='dashboard';
function updateHeader(){
  let modePill;
  if (isLive()) modePill = LIVE.ok ? `<button type="button" class="pill" data-go="view:wallet"><span class="dot live"></span>실제 <b>${esc(SET.chainName)}</b></button>` : `<button type="button" class="pill" data-go="view:wallet"><span class="dot crit"></span>RPC 오류</button>`;
  else modePill = `<button type="button" class="pill" data-go="view:wallet"><span class="dot off"></span>시뮬레이션</button>`;
  const open = isLive() ? 0 : S.alerts.filter(a=>!a.resolved).length;
  const pend = [...S.txs.values()].filter(t=>t.status==='pending').length;
  setHTML($('#pills'), `${modePill}<span class="pill">Chain ID <b>${SET.chainId}</b></span>
    <span class="pill"><span class="dot ${open?'crit':''}"></span>블록 <b>#${fmt(S.height)}</b></span>
    ${open?`<span class="pill"><span class="dot crit"></span>경보 <b>${open}</b></span>`:''}
    ${pend?`<span class="pill"><span class="spinner"></span>대기 Tx <b>${pend}</b></span>`:''}`);
  const wb=$('#wallet-btn');
  if (!W.account){ wb.className='btn sm'; wb.textContent='지갑 연결'; }
  else if (!walletOnChain()){ wb.className='btn danger sm'; wb.textContent='네트워크 전환 필요'; }
  else { wb.className='btn ghost sm'; wb.textContent=`${short(W.account,4,4)} · ${fmtCoin(W.balance)}`; }
  $('#foot-mode').textContent = isLive() ? `실제 ${SET.chainName} 메인넷 · ${SET.rpc.replace(/^https?:\/\//,'')}` : '시뮬레이션 네트워크 · 예시 데이터';
}
function render(){
  const v=(location.hash||'').slice(1);
  cur = VIEWS[v] ? v : 'dashboard';
  const V=VIEWS[cur];
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===cur));
  $('#vtitle').textContent=V.title; $('#crumb').textContent=V.crumb;
  const view=$('#view'); view.innerHTML=V.html(); view._h=null;
  V.mount && V.mount();
  updateHeader();
}
function live(){ updateHeader(); const V=VIEWS[cur]; V.live && V.live(); }
function nav(v){ if(location.hash!=='#'+v){ location.hash=v; } else render(); window.scrollTo({top:0}); }
function go(spec){
  const i=spec.indexOf(':'); const type=spec.slice(0,i), id=spec.slice(i+1);
  if (type==='view') return nav(id);
  if (type==='data'){ S.histSel=id; return nav('history'); }
  if (type==='verifyhash'){ S.verifyPrefill=id; return nav('verify'); }
  S.exSel={ type, id };
  if (cur==='explorer'){ VIEWS.explorer.detail(); $('#ex-detail').scrollIntoView({block:'start'}); } else nav('explorer');
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const c=e.target.closest('[data-copy]'); if(c){ e.preventDefault(); copyText(c.dataset.copy); }
});
window.addEventListener('hashchange',()=>{ render(); window.scrollTo({top:0}); });
$('#wallet-btn').onclick=async()=>{
  if (!W.account){
    const ch=walletChoices();
    if (ch.length===1){ try{ await connectWallet(ch[0]); toast('지갑을 연결했습니다'); if(!walletOnChain()) await switchNetwork().catch(e=>toast(decodeErr(e))); }catch(e){ toast(decodeErr(e)); } return; }
    W.picking=true; return nav('wallet');
  }
  if (!walletOnChain()){ try{ await switchNetwork(); toast(`${SET.chainName} 네트워크로 전환했습니다`); }catch(e){ toast(decodeErr(e)); } return; }
  nav('wallet');
};
(function(){
  const b=$('#reset-btn'); let armed=false, t;
  b.onclick=()=>{
    if(!armed){ armed=true; b.textContent='한 번 더 누르면 초기화'; t=setTimeout(()=>{armed=false;b.textContent='데모 데이터 초기화'},3000); return; }
    clearTimeout(t); try{ localStorage.removeItem(STORE_KEY); }catch(_){}
    location.reload();
  };
})();

(async function boot(){
  $('#view').innerHTML='<p class="muted">원장을 불러오는 중…</p>';
  discoverWallets();
  await seed(); load(); updateNodes();
  render();
  setInterval(tick, 500);
  await tryAutoReconnect();
  if (SET.mode!=='sim'){ if (await probeLive()){ await enterLive(); render(); } else updateHeader(); }
  if (cur==='wallet') VIEWS.wallet.live();
})();
</script>
