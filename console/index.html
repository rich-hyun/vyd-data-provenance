<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빈야드 데이터체인 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail grouped by the two contract items (메인넷 / 이력·진위검증) + scrolling work area; on phones the rail becomes a horizontal tab strip. */
:root{
  --bg:#F2F3F1; --surface:#FFFFFF; --surface-2:#F7F8F6; --line:#DDE1DC; --line-strong:#C6CCC6;
  --fg:#17201B; --muted:#58645D; --faint:#87918B;
  --accent:#7A2650; --accent-hover:#651E42; --accent-soft:#F4E7ED; --on-accent:#FFFFFF;
  --ok:#1D7646; --ok-soft:#E2F1E8; --warn:#9A6100; --warn-soft:#FAEFD7; --crit:#BE2E2E; --crit-soft:#FAE3E3;
  --st0:#3466A6; --st1:#21857A; --st2:#7D4BB0; --st3:#B0741A; --st4:#4D7A26;
  --code-bg:#F4F5F2; --syn-kw:#7A2650; --syn-str:#1D7646; --syn-com:#87918B; --syn-type:#3466A6;
  --shadow:0 1px 2px rgba(20,30,25,.06);
  --font-sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1311; --surface:#161B18; --surface-2:#1B211E; --line:#28302C; --line-strong:#38423D;
    --fg:#E6EBE8; --muted:#9BA6A0; --faint:#6C7771;
    --accent:#E08AB0; --accent-hover:#EBA2C2; --accent-soft:#3A2130; --on-accent:#22101A;
    --ok:#5FCB93; --ok-soft:#163226; --warn:#E7B551; --warn-soft:#382B12; --crit:#F27B7B; --crit-soft:#3C1C1C;
    --st0:#7FA9E0; --st1:#5DC4B6; --st2:#B892E0; --st3:#E4AE5E; --st4:#97C46B;
    --code-bg:#121614; --syn-kw:#E08AB0; --syn-str:#5FCB93; --syn-com:#6C7771; --syn-type:#7FA9E0;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1311; --surface:#161B18; --surface-2:#1B211E; --line:#28302C; --line-strong:#38423D;
  --fg:#E6EBE8; --muted:#9BA6A0; --faint:#6C7771;
  --accent:#E08AB0; --accent-hover:#EBA2C2; --accent-soft:#3A2130; --on-accent:#22101A;
  --ok:#5FCB93; --ok-soft:#163226; --warn:#E7B551; --warn-soft:#382B12; --crit:#F27B7B; --crit-soft:#3C1C1C;
  --st0:#7FA9E0; --st1:#5DC4B6; --st2:#B892E0; --st3:#E4AE5E; --st4:#97C46B;
  --code-bg:#121614; --syn-kw:#E08AB0; --syn-str:#5FCB93; --syn-com:#6C7771; --syn-type:#7FA9E0;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:17px} h3{font-size:14px} h4{font-size:13px}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;padding-block:16px;padding-inline:16px;max-width:1520px;margin:0 auto;min-height:100%}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 32px);overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:16px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:0 10px 4px;font-weight:600}
.nav-label em{font-style:normal;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.on{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.nav a.on .ni{background:var(--accent)}
.ni{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:4px 0 2px}
.topbar .crumb{font-size:12px;color:var(--faint)}
.top-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12.5px;color:var(--muted)}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--accent)}
.pill b{color:var(--fg);font-weight:600;font-family:var(--font-mono);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.off{background:var(--faint)}
.dot.live{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.intro{display:flex;flex-direction:column;gap:4px;max-width:76ch}
.intro p{color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);border:1px solid var(--warn);background:var(--warn-soft);font-size:13px}
.banner.ok{border-color:var(--ok);background:var(--ok-soft)}
.banner.crit{border-color:var(--crit);background:var(--crit-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.panel-h p{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.grid-2-3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-family:var(--font-mono);overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)}
.kpi.crit{border-color:var(--crit);background:var(--crit-soft)}

.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--faint);font-size:11.5px;letter-spacing:.04em;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);border-top:1px solid var(--line)}
.kv>div{padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}
.kv>div:nth-child(odd){color:var(--muted);font-size:12.5px;padding-right:12px}
.kv>div:nth-child(even){overflow-wrap:anywhere;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.method{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.method.GET{background:var(--ok-soft);color:var(--ok)}
.method.POST{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:4px 10px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent);text-underline-offset:3px;font:inherit}
.lnk.mono{font-family:var(--font-mono);font-size:12.5px}
.lnk:hover{text-decoration-color:var(--accent)}
.cp{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px;padding:1px 7px;cursor:pointer}
.cp:hover{color:var(--accent);border-color:var(--accent)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:500;color:var(--muted)}
.field .hint{font-size:12px;color:var(--faint)}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
textarea{resize:vertical;min-height:72px}
input.mono,textarea.mono{font-family:var(--font-mono);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.drop{border:1.5px dashed var(--line-strong);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;background:var(--surface-2);cursor:pointer;color:var(--muted)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--fg)}
.drop b{color:var(--fg)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.err{color:var(--crit);font-size:12.5px;background:var(--crit-soft);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
.okmsg{color:var(--ok);font-size:12.5px;background:var(--ok-soft);padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.note b{color:var(--fg)}

pre.code{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font-family:var(--font-mono);font-size:12px;line-height:1.6;max-height:520px;tab-size:4}
pre.code.short{max-height:300px}
.k-kw{color:var(--syn-kw);font-weight:600}.k-str{color:var(--syn-str)}.k-com{color:var(--syn-com);font-style:italic}.k-ty{color:var(--syn-type)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-family:var(--font-mono);font-size:10.5px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-target{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1}
.ch-line{stroke:var(--accent);stroke-width:2;fill:none}
.ch-area{fill:var(--accent-soft)}
.ch-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark{width:70px;height:20px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.5}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:12.5px}
.bar-track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--c);border-radius:5px}
.meter{display:flex;align-items:center;gap:8px}
.meter .bar-track{width:56px;height:6px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line-strong);border-radius:8px}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--faint)}
.step .bar{height:6px;border-radius:3px;background:var(--line)}
.step.done{color:var(--fg)} .step.done .bar{background:var(--c)}
.tl{display:flex;flex-direction:column;position:relative}
.tl-item{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.tl-item::before{content:"";position:absolute;left:9px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:20px;height:20px;border-radius:50%;border:4px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);margin-top:2px}
.tl-body{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.hashline{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:12px;align-items:baseline}
.hashline span:first-child{color:var(--faint)}
.hashline code{overflow-wrap:anywhere}

.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
.li:hover{border-color:var(--line-strong)}
.li.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.li .t{font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.result{border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid}
.result.ok{background:var(--ok-soft);border-color:var(--ok)}
.result.crit{background:var(--crit-soft);border-color:var(--crit)}
.result.warn{background:var(--warn-soft);border-color:var(--warn)}
.result h2{display:flex;gap:10px;align-items:center}
.result.ok h2{color:var(--ok)} .result.crit h2{color:var(--crit)} .result.warn h2{color:var(--warn)}

.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}

.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;position:relative}
.arch-col{display:flex;flex-direction:column;gap:8px;position:relative}
.arch-col+.arch-col::before{content:"→";position:absolute;left:-17px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.arch-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.box{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface-2);font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.box b{font-size:13px}
.box.acc{border-color:var(--accent);background:var(--accent-soft)}
.box .mono{font-size:11px;color:var(--muted)}

.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.check .d{color:var(--muted);font-size:12.5px}
.progress{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.progress>div{height:100%;background:var(--accent)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.steps li::marker{color:var(--accent);font-weight:600;font-family:var(--font-mono)}

.spinner{width:12px;height:12px;border:2px solid var(--warn);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.api-list{display:flex;flex-direction:column;gap:4px}
.api-item{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;width:100%}
.api-item:hover{background:var(--surface-2)}
.api-item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.api-item .p{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
.api-item small{display:block;color:var(--muted);font-size:11.5px;font-family:var(--font-sans)}
.wallet-list{display:flex;flex-direction:column;gap:6px}
.wallet-opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.wallet-opt:hover{border-color:var(--accent)}
.wallet-opt img{width:22px;height:22px}

@media (max-width:1100px){
  .grid2,.grid-3-2,.grid-2-3{grid-template-columns:minmax(0,1fr)}
  .arch{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arch-col+.arch-col::before{display:none}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{position:static;max-height:none;overflow:visible;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-group{flex-direction:row;gap:2px}
  .nav-label{display:none}
  .nav-group+.nav-group{border-left:1px solid var(--line);padding-left:4px}
  .side-foot{display:none}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv>div:nth-child(odd){border-bottom:0;padding-bottom:0}
  .arch{grid-template-columns:minmax(0,1fr)}
  .step span{font-size:10.5px}
  .top-right{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

function fnv(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function detHex(seed,bytes=32){const r=mulberry32(fnv(seed));let s='0x';for(let i=0;i<bytes;i++)s+=(r()*256|0).toString(16).padStart(2,'0');return s}
function rndHex(bytes=32){const a=new Uint8Array(bytes);crypto.getRandomValues(a);return '0x'+[...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function sha256Hex(data){
  const buf = typeof data==='string' ? new TextEncoder().encode(data) : data;
  if (crypto && crypto.subtle) {
    const d = await crypto.subtle.digest('SHA-256', buf);
    return '0x'+[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  if (HAS_ETHERS) return ethers.sha256(typeof data==='string' ? ethers.toUtf8Bytes(data) : new Uint8Array(buf));
  throw new Error('이 브라우저에서는 SHA-256을 계산할 수 없습니다 (HTTPS 필요).');
}

async function connectWallet(choice, silent){

function revertMsg(name,args){
  const role = a => Object.entries(ROLE_IDS).find(([,v])=>v===a)?.[0] || short(a);
  return ({
    DuplicateHash:'이미 원장에 등록된 콘텐츠 해시입니다. 같은 파일은 한 번만 등록할 수 있습니다.',
    InvalidStageOrder:'현재 단계보다 이전 단계는 등록할 수 없습니다 (수집→전처리→AI 가공→품질 검증→라이선스).',
    AccessControlUnauthorizedAccount:`이 지갑 주소에 ${args?role(args[1]):''} 권한이 없습니다. 관리자 지갑으로 스마트컨트랙트 화면에서 권한을 부여하세요.`,
    EmptyDataId:'데이터 ID가 비어 있습니다.', EmptyHash:'콘텐츠 해시가 비어 있습니다.', ZeroAddress:'관리자 주소가 0x0입니다.',
    InvalidRange:'앵커 범위가 올바르지 않습니다.', NotFound:'해당 데이터 ID의 이력이 없습니다.',
  })[name] || `컨트랙트가 거절했습니다: ${name}`;
}
function decodeErr(e){
  if (e?.code===4001 || e?.code==='ACTION_REJECTED' || e?.info?.error?.code===4001) return '지갑에서 요청을 거절했습니다.';
  if (e?.revert?.name) return revertMsg(e.revert.name, e.revert.args);
  const cands=[e?.data, e?.data?.data, e?.error?.data, e?.error?.data?.data, e?.info?.error?.data, e?.info?.error?.data?.data];
  if (IFACE) for (const d of cands){ if(typeof d==='string' && /^0x[0-9a-f]{8}/i.test(d)){ try{ const p=IFACE.parseError(d); if(p) return revertMsg(p.name,p.args); }catch(_){} } }
  return e?.shortMessage || e?.message || String(e);
}

const LIVE = { ok:false, err:null, probing:false, transport:null, chainId:null, height:null, client:null, peers:null, syncing:null, gasPrice:null,
  latency:null, genesis:null, validators:null, validatorSrc:null, syncedTo:null, logsErr:null, codeOk:null, stats:null, lastPoll:0, netAt:0 };
const LB = new Map(), LA = new Map(), inflight = new Map();
let rpcId = 0;
async function rpcDirect(method, params){
  const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), 8000);
  try {
    const r = await fetch(SET.rpc, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ jsonrpc:'2.0', id:++rpcId, method, params }), signal:ac.signal });
    const j = await r.json();
    if (j.error) throw Object.assign(new Error(j.error.message||'RPC 오류'), { rpcCode:j.error.code, data:j.error.data });
    return j.result;
  } finally { clearTimeout(to); }
}
async function rpc(method, params=[]){
  try { const r = await rpcDirect(method, params); LIVE.transport='direct'; return r; }
  catch(e){
    if (e.rpcCode!==undefined) throw e;
    if (walletOnChain()) {
      try { const r = await W.provider.request({ method, params }); LIVE.transport='wallet'; return r; }
      catch(e2){ if (e2?.code!==4200 && e2?.code!==-32601) throw e2; }
    }
    throw e;
  }
}
function friendlyRpcErr(e){
  if (e?.name==='AbortError') return 'RPC 응답 시간 초과(8초)';
  if (e instanceof TypeError) return `RPC(${SET.rpc})에 연결할 수 없습니다. 주소, HTTPS 인증서, 노드의 CORS 설정(Geth --http.corsdomain)을 확인하세요.`;
  return e?.message || String(e);
}
async function probeLive(){
  LIVE.probing=true;
  try {
    if (!HAS_ETHERS) throw new Error('ethers 라이브러리를 불러오지 못했습니다.');
    const cid = parseInt(await rpc('eth_chainId'),16); LIVE.chainId=cid;
    if (cid!==+SET.chainId) throw new Error(`RPC의 체인 ID(${cid})가 설정값(${SET.chainId})과 다릅니다.`);
    LIVE.height = parseInt(await rpc('eth_blockNumber'),16);
    LIVE.ok=true; LIVE.err=null; return true;
  } catch(e){ LIVE.ok=false; LIVE.err=friendlyRpcErr(e); return false; }
  finally { LIVE.probing=false; }
}
function resetLive(){
  STORES.live = makeStore(); LB.clear(); LA.clear(); inflight.clear();
  Object.assign(LIVE,{ syncedTo:null, genesis:null, validators:null, stats:null, codeOk:null, logsErr:null, netAt:0 });

}
async function enterLive(){

function enterSim(){ useStore('sim'); S.height = curHeight(); S.exSel=null; S.lastReceipt=null; }
async function goLive(quiet){
  if (SET.mode==='sim') return false;
  if (await probeLive()){ await enterLive(); if(!quiet) toast(`${SET.chainName} 메인넷에 연결했습니다`); render(); return true; }
  if (!quiet) toast('RPC 연결 실패: '+LIVE.err);
  updateHeader(); return false;
}
function ingestTx(t, blk){
  const h=t.hash.toLowerCase(); const st=STORES.live; const prev=st.txs.get(h); const tx=prev||{ hash:h };
  Object.assign(tx, { from:(t.from||'').toLowerCase(), to:t.to?t.to.toLowerCase():null, value:t.value?BigInt(t.value):0n, input:t.input||t.data||'0x',
    block: blk ? blk.number : (t.blockNumber ? parseInt(t.blockNumber,16) : null), nonce: t.nonce!=null?parseInt(t.nonce,16):null });
  if (blk) tx.time = blk.time;
  if (!tx.method || tx.method==='call') decodeTx(tx);
  if (tx.status==null || (tx.status==='pending' && tx.block!=null)) tx.status = tx.block==null ? 'pending' : 'unknown';
  st.txs.set(h, tx); return tx;
}
function decodeTx(tx){
  const plain = v => typeof v==='bigint' ? v.toString() : Array.isArray(v) ? v.map(plain) : v;
  if (tx.to && SET.contract && tx.to===SET.contract.toLowerCase() && IFACE){
    try {
      const p=IFACE.parseTransaction({ data:tx.input, value:tx.value });
      tx.method=p.name; tx.args=Object.fromEntries(p.fragment.inputs.map((f,i)=>[f.name, plain(p.args[i])]));
      if (p.name==='registerRecord') tx.args.stage = STAGES[+tx.args.stage]?.key || tx.args.stage;
      return;
    } catch(_){}
  }
  if (!tx.to){ tx.method='deploy'; tx.args={ bytecode: short(tx.input,10,6) }; }
  else if (!tx.input || tx.input==='0x'){ tx.method='transfer'; tx.args={ value: fmtCoin(tx.value) }; }
  else { tx.method='call'; tx.args={ selector: tx.input.slice(0,10), value: fmtCoin(tx.value) }; }
}
function fetchBlock(n){
  if (LB.has(n)) return Promise.resolve(LB.get(n));
  const k='b'+n; if (inflight.has(k)) return inflight.get(k);
  const p = rpc('eth_getBlockByNumber',['0x'+n.toString(16), true]).then(b=>{
    if (!b) return null;
    const blk={ number:n, hash:b.hash, parent:b.parentHash, time:parseInt(b.timestamp,16)*1000, miner:(b.miner||'').toLowerCase(),
      txs:b.transactions.map(t=>(typeof t==='string'?t:t.hash).toLowerCase()), gasUsed:parseInt(b.gasUsed,16), gasLimit:parseInt(b.gasLimit,16), size:parseInt(b.size||'0x0',16) };
    b.transactions.forEach(t=>{ if(typeof t!=='string') ingestTx(t,blk); });
    LB.set(n, blk);
    if (LB.size>400){ const min=[...LB.keys()].sort((a,b)=>a-b)[0]; LB.delete(min); }
    return blk;
  }).finally(()=>inflight.delete(k));
  inflight.set(k,p); return p;
}
async function fetchRange(a,b){ const ps=[]; for(let n=a;n<=b;n++) if(!LB.has(n)) ps.push(fetchBlock(n).catch(()=>null)); await Promise.all(ps); }
function fetchReceipt(h){
  const k='r'+h; if (inflight.has(k)) return inflight.get(k);
  const p = rpc('eth_getTransactionReceipt',[h]).then(async rc=>{
    const tx=STORES.live.txs.get(h); if(!rc || !tx) return;
    tx.status = parseInt(rc.status,16)===1 ? 'success' : 'reverted'; tx.gasUsed=parseInt(rc.gasUsed,16);
    tx.block = parseInt(rc.blockNumber,16); if (rc.contractAddress) tx.created = rc.contractAddress.toLowerCase();
    if (!tx.time){ const b=await fetchBlock(tx.block).catch(()=>null); if(b) tx.time=b.time; }
  }).finally(()=>inflight.delete(k));
  inflight.set(k,p); return p;
}
async function fetchTx(h){
  const t = await rpc('eth_getTransactionByHash',[h]); if(!t) return null;
  const tx = ingestTx(t, null);
  if (tx.block!=null){ const b=await fetchBlock(tx.block).catch(()=>null); if(b) tx.time=b.time; await fetchReceipt(h); }
  return tx;
}
async function fetchAddr(a){
  const [bal, nonce, code] = await Promise.all([ rpc('eth_getBalance',[a,'latest']), rpc('eth_getTransactionCount',[a,'latest']), rpc('eth_getCode',[a,'latest']) ]);
  const o={ balance:BigInt(bal), nonce:parseInt(nonce,16), codeSize:(code.length-2)/2, at:Date.now() }; LA.set(a,o); return o;
}
let liveTimer=null;
function scheduleLive(){ clearTimeout(liveTimer); liveTimer=setTimeout(()=>live(),120); }
function liveGetBlock(n){
  if (!(n>=0 && n<=S.height)) return null;
  const b=LB.get(n);
  if (!b){ fetchBlock(n).then(x=>{ if(x) scheduleLive(); }).catch(()=>{}); return null; }
  const prev=LB.get(n-1);
  return { ...b, bt: prev ? (b.time-prev.time)/1000 : null, proposer:{ id: labelOf(b.miner) || short(b.miner,6,4), addr:b.miner } };
}
function liveGetTx(h){
  const tx=STORES.live.txs.get(h);
  if (tx && tx.status==='unknown' && !inflight.has('r'+h)) fetchReceipt(h).then(scheduleLive).catch(()=>{});
  return tx||null;
}
async function ethCall(fn, args, from){
  const data = IFACE.encodeFunctionData(fn, args);
  const res = await rpc('eth_call',[{ to:SET.contract, data, ...(from?{from}:{}) }, 'latest']);
  return IFACE.decodeFunctionResult(fn, res);
}
async function syncLogs(){
  if (!SET.contract || !IFACE || LIVE.height==null) return;
  let from = LIVE.syncedTo==null ? (+SET.deployBlock||0) : LIVE.syncedTo+1; const to=LIVE.height;
  if (from>to) return;
  const topics=[[ IFACE.getEvent('RecordRegistered').topicHash, IFACE.getEvent('AuditLogAnchored').topicHash ]];
  try {
    while (from<=to){
      const end=Math.min(to, from+49999);
      const logs = await rpc('eth_getLogs',[{ address:SET.contract, fromBlock:'0x'+from.toString(16), toBlock:'0x'+end.toString(16), topics }]);
      logs.forEach(ingestLog);
      LIVE.syncedTo=end; from=end+1;
    }
    LIVE.logsErr=null;
  } catch(e){ LIVE.logsErr=friendlyRpcErr(e); }
}
function ingestLog(l){
  let p; try { p=IFACE.parseLog({ topics:l.topics, data:l.data }); } catch(_){ return; }
  if (!p) return;
  const st=STORES.live, block=parseInt(l.blockNumber,16), txh=l.transactionHash.toLowerCase();
  if (p.name==='RecordRegistered'){
    const ch=p.args.contentHash.toLowerCase(); if (st.hashIndex.has(ch)) return;
    const dataId=p.args.dataId;
    addEntry(dataId, META.names[dataId]||dataId, { stage:Number(p.args.stage), contentHash:ch, parentHash:p.args.parentHash.toLowerCase(), txHash:txh, block,
      time:Number(p.args.timestamp)*1000, operator:p.args.registrar.toLowerCase(), note:META.notes[ch]||'', metaURI:p.args.metaURI }, st);
    st.pendingHashes.delete(ch);
  } else if (p.name==='AuditLogAnchored'){
    if (st.anchors.some(a=>a.txHash===txh)) return;
    st.anchors.push({ id:Number(p.args.anchorId), fromSeq:Number(p.args.fromSeq), toSeq:Number(p.args.toSeq), root:p.args.merkleRoot.toLowerCase(),
      txHash:txh, block, time:Number(p.args.timestamp)*1000, auditor:p.args.auditor.toLowerCase() });
  }
  S.rev++;
}
async function netInfo(){
  LIVE.netAt=Date.now();
  const tryR=(m,p=[])=>rpc(m,p).catch(()=>null);
  const [peers, client, syncing, gp] = await Promise.all([ tryR('net_peerCount'), tryR('web3_clientVersion'), tryR('eth_syncing'), tryR('eth_gasPrice') ]);
  LIVE.peers = peers==null ? null : parseInt(peers,16); LIVE.client=client; LIVE.syncing = syncing || false; LIVE.gasPrice = gp==null ? null : BigInt(gp);
  if (!LIVE.genesis){ const g=await tryR('eth_getBlockByNumber',['0x0',false]); if(g) LIVE.genesis={ hash:g.hash, time:parseInt(g.timestamp,16)*1000, extra:g.extraData, gasLimit:parseInt(g.gasLimit,16) }; }
  let v=null, src=null;
  for (const [m,s] of [['qbft_getValidatorsByBlockNumber','QBFT API'],['ibft_getValidatorsByBlockNumber','IBFT API'],['clique_getSigners','Clique API']]){ v=await tryR(m,['latest']); if(Array.isArray(v)){ src=s; break; } }
  LIVE.validators = Array.isArray(v) ? v.map(a=>a.toLowerCase()) : null; LIVE.validatorSrc = src || '최근 블록 제안자 추정';
  if (SET.contract && IFACE){
    const code=await tryR('eth_getCode',[SET.contract,'latest']); LIVE.codeOk = !!code && code!=='0x';
    if (LIVE.codeOk){ try { const [t,d,a]=await Promise.all([ethCall('totalRecords',[]),ethCall('datasetCount',[]),ethCall('auditAnchorCount',[])]); LIVE.stats={ total:Number(t[0]), datasets:Number(d[0]), anchors:Number(a[0]) }; } catch(_){ LIVE.stats=null; } }
  } else { LIVE.codeOk=null; LIVE.stats=null; }
}
let polling=false;
async function livePoll(){
  polling=true; LIVE.lastPoll=Date.now();
  try {
    const t0=performance.now(); const h=parseInt(await rpc('eth_blockNumber'),16); LIVE.latency=Math.round(performance.now()-t0);
    LIVE.ok=true; LIVE.err=null;
    if (h!==LIVE.height){ LIVE.height=h; S.height=h; await fetchRange(Math.max(0,h-29), h); await syncLogs(); }
    if (Date.now()-LIVE.netAt>10000) await netInfo();
  } catch(e){ LIVE.ok=false; LIVE.err=friendlyRpcErr(e); }
  polling=false; live();
}

function labelOf(addr){
  if (!addr) return null;
  if (W.account && addr===W.account) return '연결된 지갑';
  if (addr===contractAddr()) return 'DataProvenanceRegistry';
  if (!isLive()){
    const a = Object.values(ACC).find(x=>x.addr===addr); if(a) return a.label;
    const n = S.nodes.find(x=>x.addr===addr); if(n) return n.id;
  } else if (LIVE.validators){ const i=LIVE.validators.indexOf(addr); if(i>=0) return `validator ${i+1}`; }
  return null;
}

const blockCache = new Map(), bgTx = new Map();
function blockTimeOf(n){ const r=mulberry32(fnv('bt'+n)); return GENESIS + n*BT + Math.floor(r()*260); }
function proposerOf(n){
  const v = VALS(); let i = n % 4;
  const inFault = S.faultWindows.some(w=>n>=w.from && (w.to==null || n<=w.to));
  if (inFault && v[i].id==='validator-03') i=(i+1)%4;
  return v[i];
}
function simGetBlock(n){
  if (!(n>=0 && n<=S.height)) return null;
  let base = blockCache.get(n);
  if (!base){
    const r = mulberry32(fnv('blk'+n)); const bg = [];
    const cnt = n===0 ? 0 : (n%5===0?1:0) + (r()<0.12?1:0);
    for (let i=0;i<cnt;i++){
      const h = detHex('probe'+n+'-'+i);
      bgTx.set(h,{hash:h,from:ACC.probe.addr,to:ACC.probe.addr,method:'transfer',args:{value:'0 '+SET.symbol,purpose:'관제 프로브(블록 포함 확인)'},status:'success',block:n,time:blockTimeOf(n),gasUsed:21000,bg:true});
      bg.push(h);
    }
    base = { number:n, hash: n===0?GENESIS_HASH:detHex('blk'+n), parent: n===0?ZERO:(n===1?GENESIS_HASH:detHex('blk'+(n-1))),
      time: blockTimeOf(n), bt: n===0?0:(blockTimeOf(n)-blockTimeOf(n-1))/1000, bg, size: 610 + (r()*380|0) };
    blockCache.set(n, base);
    if (blockCache.size > 600){ const k=blockCache.keys().next().value; blockCache.get(k).bg.forEach(h=>bgTx.delete(h)); blockCache.delete(k); }
  }
  const txs = [ ...(S.blockTx.get(n)||[]), ...base.bg ];
  const gasUsed = txs.reduce((a,h)=>a+(getTx(h)?.gasUsed||0),0);
  const p = proposerOf(n);
  return { ...base, txs, gasUsed, proposer:{ id:p.id, addr:p.addr } };
}
const getBlock = n => isLive() ? liveGetBlock(n) : simGetBlock(n);
const getTx = h => isLive() ? liveGetTx(h) : (S.txs.get(h) || bgTx.get(h) || null);
function indexTx(tx){ if(tx.block==null) return; const a=S.blockTx.get(tx.block)||[]; if(!a.includes(tx.hash)) a.push(tx.hash); S.blockTx.set(tx.block,a); }
function putTx(tx){ S.txs.set(tx.hash, tx); indexTx(tx); }

/* ---------- 이력 레코드 (공통) ---------- */
function addEntry(dataId, name, e, st=S){
  let r = st.records.get(dataId);
  if (!r){ r = { dataId, name: name||dataId, entries: [] }; st.records.set(dataId, r); }
  r.entries.push(e);
  st.hashIndex.set(e.contentHash, { dataId, idx: r.entries.length-1 });
}
function parseStage(v){
  if (typeof v==='number' && STAGES[v]) return v;
  const s = String(v??'').trim().toUpperCase();
  if (/^\d$/.test(s) && STAGES[+s]) return +s;
  const f = STAGES.find(x=>x.key===s); if (f) return f.id;
  throw E(400,'INVALID_STAGE','stage 값은 COLLECT, PREPROCESS, AI_PROCESS, QA, LICENSE 중 하나여야 합니다.');
}
function validateRecord(input){
  const dataId = String(input.dataId||'').trim();
  if (!/^[A-Za-z0-9][A-Za-z0-9_.-]{2,63}$/.test(dataId)) throw E(400,'INVALID_DATA_ID','데이터 ID는 영문·숫자·-_. 조합 3~64자로 입력하세요. 예: DS-2026-0040');
  const stage = parseStage(input.stage);
  const contentHash = String(input.contentHash||'').trim().toLowerCase();
  if (!/^0x[0-9a-f]{64}$/.test(contentHash)) throw E(400,'INVALID_HASH','contentHash는 0x로 시작하는 64자리 16진수(SHA-256)여야 합니다. 파일을 선택하면 자동 계산됩니다.');
  if (S.hashIndex.has(contentHash) || S.pendingHashes.has(contentHash)) throw E(409,'DUPLICATE_HASH','이미 원장에 등록된 콘텐츠 해시입니다. 같은 파일은 한 번만 등록할 수 있습니다.');
  const rec = S.records.get(dataId);
  const last = rec ? rec.entries[rec.entries.length-1] : null;
  if (last && stage < last.stage) throw E(422,'STAGE_ORDER',`현재 단계(${STAGES[last.stage].label})보다 이전 단계는 등록할 수 없습니다. 라이프사이클은 수집→전처리→AI 가공→품질 검증→라이선스 순입니다.`);
  return { dataId, stage, contentHash, rec, parentHash: last?last.contentHash:ZERO };
}
function submitRecord(input, source){
  const v = validateRecord(input);
  const opKey = input.operator && ACC[input.operator] ? input.operator : STAGE_OP[v.stage];
  const tx = {
    hash: rndHex(32), from: ACC[opKey].addr, to: SIM_CONTRACT, method:'registerRecord',
    args: { dataId:v.dataId, stage: STAGES[v.stage].key, contentHash:v.contentHash, metaURI: input.metaURI||'' },
    parentHash: v.parentHash,
    meta: { name: input.name || (v.rec?v.rec.name:v.dataId), note: input.note||'', fileName: input.fileName||'', size: input.size||null, operator: opKey, source },
    status:'pending', block:null, time:Date.now(), gasUsed: 141000 + (Math.random()*9000|0), user:true,
  };
  S.txs.set(tx.hash, tx); S.pending.push(tx); S.pendingHashes.add(v.contentHash);
  audit('TX', ACC[opKey].label, 'registerRecord 제출', `${v.dataId} · ${STAGES[v.stage].label}`, '대기', tx.hash);
  return tx;
}
async function liveRegister(input){
  if (!SET.contract) throw E(0,'NO_CONTRACT','컨트랙트 주소가 설정되지 않았습니다. 스마트컨트랙트 화면에서 배포하거나 기존 주소를 연결하세요.');
  requireWallet();
  const v = validateRecord(input);
  const args = [v.dataId, v.stage, v.contentHash, input.metaURI||''];
  try { await rpc('eth_call',[{ from:W.account, to:SET.contract, data:IFACE.encodeFunctionData('registerRecord',args) },'latest']); }
  catch(e){ throw E(0,'REVERT',decodeErr(e)); }
  const c = new ethers.Contract(SET.contract, ARTIFACT.abi, await getSigner());
  let sent; try { sent = await c.registerRecord(...args); } catch(e){ throw E(0,'WALLET',decodeErr(e)); }
  if (input.name && !META.names[v.dataId]) META.names[v.dataId]=input.name;
  if (input.note) META.notes[v.contentHash]=input.note;
  saveMeta();
  const tx = { hash:sent.hash.toLowerCase(), from:W.account, to:SET.contract.toLowerCase(), method:'registerRecord',
    args:{ dataId:v.dataId, stage:STAGES[v.stage].key, contentHash:v.contentHash, metaURI:input.metaURI||'' }, parentHash:v.parentHash,
    meta:{ name:input.name, note:input.note }, status:'pending', block:null, time:Date.now(), gasUsed:null, user:true };
  STORES.live.txs.set(tx.hash, tx); STORES.live.pendingHashes.add(v.contentHash);
  audit('TX', short(W.account,6,4), 'registerRecord 제출(지갑)', `${v.dataId} · ${STAGES[v.stage].label}`, '대기', tx.hash);
  sent.wait().then(async rc=>{
    tx.status = rc.status===1 ? 'success' : 'reverted'; tx.block=rc.blockNumber; tx.gasUsed=Number(rc.gasUsed);
    const b = await fetchBlock(rc.blockNumber).catch(()=>null); if (b) tx.time=b.time;
    if (rc.blockNumber > (LIVE.height||0)){ LIVE.height=rc.blockNumber; S.height=rc.blockNumber; }
    await syncLogs();
    audit('REGISTER', short(W.account,6,4), 'registerRecord 확정', `${v.dataId} · ${STAGES[v.stage].label}`, tx.status==='success'?'성공':'실패', tx.hash);
    live();
  }).catch(e=>{ tx.status='reverted'; tx.error=decodeErr(e); STORES.live.pendingHashes.delete(v.contentHash); live(); });
  return tx;
}
function confirmTx(tx, n){
  tx.block = n; tx.time = blockTimeOf(n);
  if (tx.method==='registerRecord'){
    S.pendingHashes.delete(tx.args.contentHash);
    if (S.hashIndex.has(tx.args.contentHash)){ tx.status='reverted'; tx.error='DuplicateHash'; }
    else {
      tx.status='success';
      const st = parseStage(tx.args.stage);
      const e = { stage:st, contentHash:tx.args.contentHash, parentHash:tx.parentHash, txHash:tx.hash, block:n, time:tx.time,
        operator:tx.meta.operator, note:tx.meta.note, metaURI:tx.args.metaURI, fileName:tx.meta.fileName, size:tx.meta.size };
      addEntry(tx.args.dataId, tx.meta.name, e);
      S.userEntries.push({ dataId:tx.args.dataId, name:tx.meta.name, e });
      audit('REGISTER', ACC[tx.meta.operator].label, 'registerRecord 확정', `${tx.args.dataId} · ${STAGES[st].label}`, '성공', tx.hash);
    }
  } else if (tx.method==='anchorAuditLog'){
    tx.status='success';
    const a = S.anchors.find(x=>x.txHash===tx.hash); if (a){ a.block=n; a.time=tx.time; }
  } else tx.status='success';
  indexTx(tx); S.rev++;
}

/* ---------- 감사 로그 + 머클 앵커 ----------
   leaf = sha256(JSON.stringify([seq, ts, type, actor, action, target, result, tx]))
   node = sha256(왼쪽hex + 오른쪽hex(0x 제외)), 홀수면 마지막 노드 복제 — API 서버와 같은 규칙 */
function audit(type, actor, action, target, result, tx){
  const seq = S.audit.length + 1;
  S.audit.push({ seq, time:Date.now(), type, actor, action, target, result, tx:tx||null, user:true });
  S.rev++; save(); if (!isLive()) maybeAnchor();
}
const leafOf = e => JSON.stringify([e.seq, e.ts ?? e.time, e.type, e.actor, e.action, e.target, e.result, e.tx||'']);
async function merkleRoot(entries){
  let lvl = await Promise.all(entries.map(e=>sha256Hex(leafOf(e))));
  while (lvl.length>1){
    const nx=[]; for(let i=0;i<lvl.length;i+=2){ const a=lvl[i], b=lvl[i+1]??lvl[i]; nx.push(await sha256Hex(a+b.slice(2))); }
    lvl = nx;
  }
  return lvl[0];
}
async function maybeAnchor(){
  const st=STORES.sim;
  if (S.anchoring) return;
  const lastTo = st.anchors.length ? st.anchors[st.anchors.length-1].toSeq : 0;
  if (S.audit.length - lastTo < ANCHOR_SIZE) return;
  S.anchoring = true;
  const fromSeq = lastTo+1, toSeq = lastTo+ANCHOR_SIZE;
  const root = await merkleRoot(S.audit.slice(fromSeq-1, toSeq));
  const tx = { hash:rndHex(32), from:ACC.auditor.addr, to:SIM_CONTRACT, method:'anchorAuditLog', args:{ merkleRoot:root, fromSeq, toSeq },
    status:'pending', block:null, time:Date.now(), gasUsed: 94000+(Math.random()*4000|0), user:true };
  st.anchors.push({ id:st.anchors.length, fromSeq, toSeq, root, txHash:tx.hash, block:null, time:Date.now(), user:true });
  st.txs.set(tx.hash, tx); st.pending.push(tx);
  S.anchoring = false;
  audit('ANCHOR', ACC.auditor.label, 'anchorAuditLog 제출', `#${fromSeq}–#${toSeq}`, '대기', tx.hash);
}

/* ---------- 진위 검증 ---------- */
function finishVerify(res, hash, target, actor){
  res.hash = hash; res.target = target||''; res.time = Date.now(); res.height = S.height;
  S.verifications++;
  S.verifyLog.unshift({ time:res.time, hash, status:res.status, dataId:res.dataId||target||'', live:isLive() }); S.verifyLog.length = Math.min(S.verifyLog.length, 12);
  audit('VERIFY', actor||'콘솔 사용자', isLive()?'verify (온체인 eth_call)':'verify', `${res.dataId||target||'전체 원장'} · ${short(hash,6,4)}`, {MATCH:'진본 확인',MISMATCH:'불일치',NOT_FOUND:'미등록'}[res.status]);
  return res;
}
function normHash(hash){
  hash = String(hash||'').trim().toLowerCase();
  if (!/^0x[0-9a-f]{64}$/.test(hash)) throw E(400,'INVALID_HASH','검증할 해시는 0x로 시작하는 64자리 16진수여야 합니다.');
  return hash;
}
function verifyHash(hash, target, actor){
  hash = normHash(hash);
  const hit = S.hashIndex.get(hash); let res;
  if (hit && (!target || hit.dataId===target)){
    const r = S.records.get(hit.dataId);
    res = { status:'MATCH', dataId:hit.dataId, name:r.name, entry:r.entries[hit.idx], isLatest: hit.idx===r.entries.length-1 };
  } else if (target && S.records.has(target)){
    const r = S.records.get(target);
    res = { status:'MISMATCH', dataId:target, name:r.name, expected:r.entries[r.entries.length-1], otherHit: hit||null };
  } else res = { status:'NOT_FOUND' };
  return finishVerify(res, hash, target, actor);
}
async function verifyLive(hash, target){
  hash = normHash(hash);
  if (!SET.contract) throw E(0,'NO_CONTRACT','컨트랙트 주소가 설정되지 않았습니다.');
  const [found, dataId, index, rec] = await ethCall('verify',[hash]);
  const toEntry = (x, ch) => ({ stage:Number(x.stage), contentHash:ch||x.contentHash.toLowerCase(), parentHash:x.parentHash.toLowerCase(), txHash:null, block:Number(x.blockNumber), time:Number(x.timestamp)*1000, operator:x.registrar.toLowerCase(), metaURI:x.metaURI });
  let res;
  if (found && (!target || dataId===target)){
    const r = S.records.get(dataId);
    const e = r?.entries[Number(index)] || toEntry(rec, hash);
    res = { status:'MATCH', dataId, name:r?.name||META.names[dataId]||dataId, entry:e, isLatest: r ? Number(index)===r.entries.length-1 : true };
  } else if (target){
    const [list] = await ethCall('getHistory',[target]);
    if (list.length){
      const r=S.records.get(target);
      res = { status:'MISMATCH', dataId:target, name:r?.name||target, expected: r?.entries[r.entries.length-1] || toEntry(list[list.length-1]), otherHit: found?{ dataId }:null };
    } else res = { status:'NOT_FOUND' };
  } else res = { status:'NOT_FOUND' };
  return finishVerify(res, hash, target);
}

/* ---------- 저장 (시뮬레이션 데모 데이터) ---------- */
function save(){
  const st=STORES.sim;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      txs: [...st.txs.values()].filter(t=>t.user && t.status!=='pending'),
      entries: S.userEntries, audit: S.audit.filter(a=>a.user),
      anchors: st.anchors.filter(a=>a.user && a.block!=null),
      verifyLog: S.verifyLog, verifications: S.verifications, checks: S.checks,
      apiKeys: S.apiKeys.filter(k=>k.user),
    }));
  }catch(_){}
}
function load(){
  let d=null; try{ d = JSON.parse(localStorage.getItem(STORE_KEY)||'null'); }catch(_){}
  if (!d) return;
  const st=STORES.sim;
  (d.txs||[]).forEach(t=>{ if(t.block!=null && t.block<=S.height) putTx(t); });
  (d.entries||[]).forEach(x=>{ if(!st.hashIndex.has(x.e.contentHash)){ addEntry(x.dataId,x.name,x.e,st); S.userEntries.push(x);} });
  (d.audit||[]).forEach(a=>{ if(a.seq===S.audit.length+1) S.audit.push(a); });
  (d.anchors||[]).forEach(a=>{ if(a.toSeq<=S.audit.length && a.fromSeq===(st.anchors.length?st.anchors[st.anchors.length-1].toSeq+1:1)) st.anchors.push(a); });
  S.verifyLog = d.verifyLog||[]; S.verifications = d.verifications||0; S.checks = d.checks||{};
  (d.apiKeys||[]).forEach(k=>S.apiKeys.push(k));
}

    S.audit.push({ ...e, seq:++seq });
    if (seq-from+1 >= ANCHOR_SIZE){
      const to=seq, t=e.time+4000, n=blockAt(t)+1, txh=detHex('anchor-'+from);
      st.anchors.push({ id:st.anchors.length, fromSeq:from, toSeq:to, root:null, txHash:txh, block:n, time:blockTimeOf(n) });
      S.audit.push({ seq:++seq, time:blockTimeOf(n)+1000, type:'ANCHOR', actor:ACC.auditor.label, action:'anchorAuditLog 확정', target:`#${from}–#${to}`, result:'성공', tx:txh });
      from = to+1;
    }
  }
  for (const a of st.anchors){
    a.root = await merkleRoot(S.audit.slice(a.fromSeq-1, a.toSeq));
    putTx({ hash:a.txHash, from:ACC.auditor.addr, to:SIM_CONTRACT, method:'anchorAuditLog', args:{ merkleRoot:a.root, fromSeq:a.fromSeq, toSeq:a.toSeq }, status:'success', block:a.block, time:a.time, gasUsed:95210 });
  }
  S.alerts = [
    { level:'warn', node:'rpc-01', title:'디스크 사용률 82%', detail:'로그 로테이션 적용 후 64%로 감소', time:blockTimeOf(1702560)-7200e3, resolved:true },
    { level:'warn', node:'validator-02', title:'블록 동기화 3블록 지연', detail:'IDC-A 스위치 재연결 후 12초 내 정상화', time:blockTimeOf(1188906)+3600e3, resolved:true },
  ];
  S.apiKeys = [
    { name:'데이터 파이프라인', key:'vyk_live_'+detHex('k1',12).slice(2), scope:'write · read · verify', created:blockTimeOf(ROLE_BLOCK)+7200e3 },
    { name:'데이터 포털(조회)', key:'vyk_live_'+detHex('k2',12).slice(2), scope:'read · verify', created:blockTimeOf(ROLE_BLOCK)+9000e3 },
  ];
  S.sampleHash = sampleHash;
  S.tamperedHash = await sha256Hex(SAMPLE_TAMPERED);
  S.sourceHash = await sha256Hex(SOL_SOURCE);
}

/* ---------- 루프 ---------- */
function updateNodes(){
  const alive = S.nodes.filter(n=>!n.down).length;
  S.nodes.forEach(nd=>{
    if (nd.down){ nd.status='down'; nd.peers=0; nd.cpu=0; nd.latency=null; nd.hist.push(0); nd.hist.shift(); return; }
    nd.height = S.height - (Math.random()<0.06?1:0); nd.peers = alive-1;
    nd.cpu = Math.max(5, Math.min(74, nd.cpu + (Math.random()-.5)*7));
    nd.mem = Math.max(30, Math.min(80, nd.mem + (Math.random()-.5)*1.2));
    nd.disk = Math.min(79, nd.disk + 0.002);
    nd.latency = Math.max(1, Math.round((nd.role==='RPC'?6:3) + Math.random()*5));
    nd.status = nd.cpu>70 ? 'warn' : 'ok';
    nd.hist.push(nd.cpu); nd.hist.shift();
  });
}
function simTick(){
  const h = curHeight();
  if (h <= S.height) return;
  for (let n=S.height+1; n<=h; n++){ S.height = n; if (S.pending.length) S.pending.splice(0).forEach(tx=>confirmTx(tx,n)); }
  updateNodes(); save(); live();
}
function tick(){
  if (!isLive()) return simTick();
  if (!polling && Date.now()-LIVE.lastPoll >= 2000) livePoll();
}
function setFault(on){
  const v = S.nodes.find(n=>n.id==='validator-03');
  if (on && !v.down){
    v.down = true; S.faultWindows.push({ from:S.height+1, to:null });
    S.alerts.unshift({ level:'crit', node:'validator-03', title:'노드 응답 없음 · 피어 0', detail:'블록 동기화 중단. QBFT 정족수 3/4 유지 중이라 블록 생성은 계속됩니다.', time:Date.now(), resolved:false });
    audit('NODE','관제 시스템','경보 발생','validator-03 응답 없음','경보');
  } else if (!on && v.down){
    v.down = false; const w=S.faultWindows[S.faultWindows.length-1]; if(w) w.to=S.height;
    S.alerts.forEach(a=>{ if(a.node==='validator-03' && !a.resolved) a.resolved=true; });
    S.alerts.unshift({ level:'ok', node:'validator-03', title:'노드 복구 · 동기화 완료', detail:`#${fmt(S.height)}까지 따라잡음, 피어 ${S.nodes.length-1}개 재연결`, time:Date.now(), resolved:true });
    audit('NODE','관제 시스템','경보 해제','validator-03 복구','정상화');
  }
  updateNodes();
}

let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, 3200); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast('복사했습니다'); }
  catch(_){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(__){}
    ta.remove(); toast(ok?'복사했습니다':'복사가 막혀 있습니다. 값을 직접 선택해 복사하세요.');
  }
}
function niceRange(vals){
  const lo=Math.min(...vals), hi=Math.max(...vals);
  if (hi-lo<0.6 && lo>0.5) { const m=Math.round((lo+hi)/2*10)/10; return { min:Math.max(0,m-0.4), max:m+0.4 }; }
  return { min:Math.max(0,Math.floor(lo)-1), max:Math.ceil(hi)+1 };
}
function lineChart(vals, o){
  const W_=640,H=190,L=46,R=14,T=12,B=26;
  const ticks=[0,1,2,3,4].map(i=>o.min+(o.max-o.min)*i/4);
  const x=i=>L+(W_-L-R)*i/Math.max(1,vals.length-1);
  const y=v=>T+(H-T-B)*(1-(Math.min(o.max,Math.max(o.min,v))-o.min)/(o.max-o.min));
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  let s=`<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(o.label)}">`;
  ticks.forEach(t=>{ s+=`<line class="ch-grid" x1="${L}" x2="${W_-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+3.5}" text-anchor="end">${t.toFixed(1)}${o.unit}</text>`; });
  if (o.target!=null && o.target>=o.min && o.target<=o.max) s+=`<line class="ch-target" x1="${L}" x2="${W_-R}" y1="${y(o.target)}" y2="${y(o.target)}"/>`;
  s+=`<path class="ch-area" d="M${x(0)},${y(o.min)} L${pts.join(' L')} L${x(vals.length-1)},${y(o.min)} Z"/>`;
  s+=`<polyline class="ch-line" points="${pts.join(' ')}"/>`;
  const li=vals.length-1; s+=`<circle class="ch-dot" cx="${x(li)}" cy="${y(vals[li])}" r="4.5"/>`;
  s+=`<text x="${L}" y="${H-6}">${esc(o.xl[0])}</text><text x="${W_-R}" y="${H-6}" text-anchor="end">${esc(o.xl[1])}</text>`;
  return s+'</svg>';
}
function spark(arr){
  const W_=70,H=20; const pts=arr.map((v,i)=>`${(W_*i/(arr.length-1)).toFixed(1)},${(H-2-(H-4)*Math.min(100,v)/80).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W_} ${H}" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}
const meter = (v, warnAt=75) => `<div class="meter"><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,v)}%;--c:${v>=warnAt?'var(--warn)':'var(--ok)'}"></div></div><span class="mono">${Math.round(v)}%</span></div>`;
function kpi(k,v,s,state){ return `<div class="kpi ${state||''}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }
function allEntries(){ const out=[]; S.records.forEach(r=>r.entries.forEach(e=>out.push({...e,dataId:r.dataId,name:r.name}))); return out; }
function chainIntegrity(r){
  for (let i=0;i<r.entries.length;i++){ const want = i===0 ? ZERO : r.entries[i-1].contentHash; if (r.entries[i].parentHash!==want) return { ok:false, at:i }; }
  return { ok:true };
}
function recentBlocks(k){ const out=[]; for(let i=k-1;i>=0;i--){ const b=getBlock(S.height-i); if(b) out.push(b); } return out; }
function modeBanner(){
  if (isLive()) return '';
  if (SET.mode==='sim') return `<div class="banner"><span><b>시뮬레이션 모드</b> · 예시 데이터로 동작 중입니다.</span>${goBtn('view:wallet','실제 네트워크로 전환','btn ghost sm')}</div>`;

}
function contractBanner(){

}

    config:{ chainId:+SET.chainId, berlinBlock:0, londonBlock:0, zeroBaseFee:true, qbft:{ blockperiodseconds:2, epochlength:30000, requesttimeoutseconds:4 } },

          <tr><td>블록 높이 지연</td><td class="mono">≥ 3블록</td><td class="mono">≥ 15블록</td></tr>
          <tr><td>피어 수</td><td class="mono">&lt; 4</td><td class="mono">0</td></tr>
          <tr><td>CPU 사용률</td><td class="mono">≥ 70%</td><td class="mono">≥ 90%</td></tr>
          <tr><td>디스크 사용률</td><td class="mono">≥ 80%</td><td class="mono">≥ 90%</td></tr>
          <tr><td>Validator 가용</td><td class="mono">3/4</td><td class="mono">≤ 2/4 (합의 중단)</td></tr>
        </tbody></table></div>
      </div>
    </section>`;
  },
  mount(){ if (isLive()) fetchRange(Math.max(0,S.height-99), S.height).then(scheduleLive); this.live(); },
  live(){ isLive() ? this.liveReal() : this.liveSim(); },
  liveReal(){
    if (!$('#nd-vals')) return render();
    const blocks=[]; for(let i=0;i<100;i++){ const b=LB.get(S.height-i); if(b) blocks.push(b); }
    const bts=[]; blocks.forEach(b=>{ const p=LB.get(b.number-1); if(p) bts.push((b.time-p.time)/1000); });
    const avg = bts.length ? bts.reduce((a,b)=>a+b,0)/bts.length : null;
    const lb=LB.get(S.height); const age = lb ? (Date.now()-lb.time)/1000 : null;
    const stall = age!=null && age > Math.max(15,(avg||2)*5);
    const vals = LIVE.validators || [...new Set(blocks.map(b=>b.miner))];
    const rows = vals.map(v=>{ const mine=blocks.filter(b=>b.miner===v); return { v, n:mine.length, last:mine[0]?.number ?? null, lastT:mine[0]?.time ?? null }; });
    const expectMiss = blocks.length >= vals.length*3;
    const alerts=[];
    if (!LIVE.ok) alerts.push({ crit:true, t:'RPC 응답 없음', d:LIVE.err });
    if (stall) alerts.push({ crit:true, t:'블록 생성 정지 의심', d:`마지막 블록 #${fmt(S.height)} 이후 ${Math.round(age)}초 경과` });
    if (LIVE.peers===0) alerts.push({ crit:true, t:'피어 0', d:'RPC 노드가 다른 노드와 연결되지 않았습니다.' });
    if (LIVE.syncing) alerts.push({ crit:false, t:'동기화 중', d:'RPC 노드가 최신 블록을 따라잡는 중입니다.' });
    if (LIVE.validators && expectMiss) rows.filter(r=>r.n===0).forEach(r=>alerts.push({ crit:false, t:'검증자 제안 없음', d:`${short(r.v,6,4)} · 최근 ${blocks.length}블록 동안 블록 제안 0건` }));
    if (LIVE.logsErr) alerts.push({ crit:false, t:'이벤트 조회 실패', d:LIVE.logsErr });
    setHTML($('#nd-summary'),
      kpi('블록 생성', stall?'정지 의심':'정상', `#${fmt(S.height)} · ${age==null?'—':Math.round(age)+'초 전'}`, stall?'crit':'') +
      kpi('평균 블록 시간', avg==null?'—':avg.toFixed(2)+'s', `최근 ${bts.length}개 간격`) +
      kpi('피어', LIVE.peers??'—', LIVE.syncing?'동기화 중':'동기화 완료', LIVE.peers===0?'crit':'') +
      kpi('RPC 응답', LIVE.latency!=null?LIVE.latency+'ms':'—', LIVE.transport==='wallet'?'지갑 경유':'직접 호출', !LIVE.ok?'crit':'') +
      kpi('가스 가격', LIVE.gasPrice==null?'—':(LIVE.gasPrice===0n?'0':ethers.formatUnits(LIVE.gasPrice,'gwei')+' gwei'), esc((LIVE.client||'').split('/').slice(0,2).join('/')||'클라이언트 —')));
    setHTML($('#nd-vsrc'), `${esc(LIVE.validatorSrc||'')} · 최근 ${blocks.length}블록 기준`);
    setHTML($('#nd-vals'), rows.length ? `<table><thead><tr><th>검증자</th><th class="num">제안 블록</th><th>마지막 제안</th><th>상태</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>${addrLink(r.v)}</td><td class="num mono">${r.n}</td><td>${r.last!=null?blkLink(r.last)+' <span class="small muted">'+ago(r.lastT)+'</span>':'—'}</td>
        <td>${r.n>0?'<span class="chip ok">정상</span>':expectMiss?'<span class="chip warn">제안 없음</span>':'<span class="chip">집계 중</span>'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">블록을 불러오는 중입니다.</div>');
    setHTML($('#nd-alerts'), alerts.length ? alerts.map(a=>`<div class="li" style="cursor:default"><div class="t"><span>${esc(a.t)}</span><span class="chip ${a.crit?'crit':'warn'}">${a.crit?'위험':'주의'}</span></div><div class="small">${esc(a.d||'')}</div></div>`).join('') : '<div class="okmsg">현재 경보가 없습니다.</div>');
  },
  liveSim(){
    if (!$('#nd-table')) return render();
    const v3=S.nodes.find(n=>n.id==='validator-03');
    const vAlive=VALS().filter(n=>!n.down).length, alive=S.nodes.filter(n=>!n.down).length;
    const open=S.alerts.filter(a=>!a.resolved).length;
    setHTML($('#nd-summary'),
      kpi('합의 상태', vAlive>=3?'정상':'중단', `QBFT 정족수 ${vAlive}/4 (최소 3)`, vAlive<4?'warn':'') +
      kpi('가동 노드', `${alive}/${S.nodes.length}`, `블록 #${fmt(S.height)}`, alive<S.nodes.length?'crit':'') +
      kpi('진행 중 경보', open, open?'즉시 확인 필요':'없음', open?'crit':'') +
      kpi('평균 응답', Math.round(S.nodes.filter(n=>!n.down).reduce((a,n)=>a+n.latency,0)/alive)+'ms', 'RPC eth_blockNumber 기준'));
    setHTML($('#nd-actions'), v3.down ? `<button class="btn sm" type="button" id="fault-off">validator-03 복구</button>` : `<button class="btn danger sm" type="button" id="fault-on">장애 시뮬레이션: validator-03 중지</button>`);
    setHTML($('#nd-table'), `<table><thead><tr><th>노드</th><th>상태</th><th class="num">블록 높이</th><th class="num">피어</th><th>CPU</th><th>메모리</th><th>디스크</th><th class="num">응답</th></tr></thead><tbody>
      ${S.nodes.map(n=>`<tr>
        <td><b>${n.id}</b><div class="small muted">${n.role} · ${n.host}</div></td>
        <td>${n.down?'<span class="chip crit">응답 없음</span>':n.status==='warn'?'<span class="chip warn">주의</span>':'<span class="chip ok">정상</span>'}</td>
        <td class="num mono">${fmt(n.height)}${n.down?`<div class="small" style="color:var(--crit)">−${fmt(S.height-n.height)}</div>`:''}</td>
        <td class="num mono">${n.peers}</td>
        <td><div class="row" style="flex-wrap:nowrap">${spark(n.hist)}<span class="mono">${Math.round(n.cpu)}%</span></div></td>
        <td>${n.down?'—':meter(n.mem)}</td><td>${meter(n.disk,80)}</td>
        <td class="num mono">${n.latency==null?'—':n.latency+'ms'}</td></tr>`).join('')}</tbody></table>`);
    setHTML($('#nd-alerts'), S.alerts.slice(0,8).map(a=>`<div class="li" style="cursor:default">
      <div class="t"><span>${esc(a.title)}</span><span class="chip ${a.resolved?(a.level==='ok'?'ok':''):'crit'}">${a.resolved?(a.level==='ok'?'복구':'해제됨'):'진행 중'}</span></div>
      <div class="small muted">${esc(a.node)} · ${fmtDT(a.time)}</div><div class="small">${esc(a.detail)}</div></div>`).join(''));
    const on=$('#fault-on'), off=$('#fault-off');
    if (on) on.onclick=()=>{ setFault(true); this.live(); updateHeader(); toast('validator-03을 중지했습니다'); };
    if (off) off.onclick=()=>{ setFault(false); this.live(); updateHeader(); toast('validator-03을 복구했습니다'); };
  }
};

async function exSearch(q){
  q=q.trim().replace(/,/g,'');
  if (!q) return;
  const show=(type,id)=>{ S.exSel={type,id:String(id)}; VIEWS.explorer.detail(); };
  if (/^#?\d+$/.test(q)){ const n=+q.replace('#',''); if(n<=S.height) return show('block',n); return toast(`아직 생성되지 않은 블록입니다 (현재 #${fmt(S.height)})`); }
  if (/^0x[0-9a-fA-F]{64}$/.test(q)){
    const h=q.toLowerCase();
    if (getTx(h)) return show('tx',h);
    if (S.hashIndex.has(h)) return show('hash',h);
    if (isLive()){ try { const t=await fetchTx(h); if(t) return show('tx',h); } catch(e){ return toast(friendlyRpcErr(e)); } }
    return toast('해당 해시의 트랜잭션이나 이력을 찾지 못했습니다');
  }
  if (/^0x[0-9a-fA-F]{40}$/.test(q)) return show('addr',q.toLowerCase());
  const d=[...S.records.keys()].find(k=>k.toLowerCase()===q.toLowerCase()); if(d){ S.histSel=d; return nav('history'); }
  toast('블록 번호, 0x 해시, 주소, 데이터 ID 형식으로 입력하세요');
}

          ${liveOps

            : `<div class="field"><label for="rg-op">등록 주체</label><select id="rg-op">${STAGE_OP.concat('pipeline').map(k=>`<option value="${k}">${ACC[k].label}</option>`).join('')}</select></div>`}
          <div class="field full"><span class="flabel">대상 파일</span>
            <label class="drop" id="rg-drop" for="rg-file"><input type="file" id="rg-file"><b id="rg-file-name">파일을 끌어다 놓거나 클릭해서 선택</b><span class="small">브라우저에서 SHA-256을 계산합니다.</span></label></div>
          <div class="field full"><label for="rg-hash">콘텐츠 해시 (SHA-256)</label><input type="text" id="rg-hash" class="mono" placeholder="0x로 시작하는 64자리, 파일을 선택하면 자동 입력"><span class="hint">외부 시스템에서 계산한 해시를 붙여넣어도 됩니다.</span></div>
          <div class="field full"><label for="rg-uri">메타데이터 URI</label><input type="text" id="rg-uri" class="mono" placeholder="s3://vy-data/DS-2026-0040/collect/manifest.json"></div>
          <div class="field full"><label for="rg-note">작업 내용</label><textarea id="rg-note" placeholder="이번 단계에서 수행한 처리 내용 (체인에는 기록되지 않음)"></textarea></div>
        </div>
        <div id="rg-err" class="err" hidden></div>

      </form>
      <div class="stack">
        <div class="panel"><h3>등록 결과</h3><div id="rg-receipt"><p class="muted small">등록하면 트랜잭션 영수증이 여기에 표시됩니다.</p></div></div>
        <div class="panel">
          <h3>기록 규칙</h3>
          <ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
            <li>같은 데이터 ID 안에서 이전 단계 해시가 <code>parentHash</code>로 자동 연결되어 가공 계보가 남습니다.</li>
            <li>단계는 되돌릴 수 없습니다. 품질 검증 이후에 전처리를 다시 등록하면 거절됩니다.</li>
            <li>같은 콘텐츠 해시는 원장 전체에서 한 번만 등록됩니다.</li>

          </ul>
        </div>
      </div>
    </section>`;
  },
  mount(){
    const id=$('#rg-id'), file=$('#rg-file'), drop=$('#rg-drop');
    const refresh=()=>{
      const r=S.records.get(id.value.trim());
      $('#rg-name-wrap').hidden=!!r;
      if (r){
        const last=r.entries[r.entries.length-1];
        $('#rg-id-hint').innerHTML=`${esc(r.name)} · 현재 단계 <b>${STAGES[last.stage].label}</b> · parentHash ${short(last.contentHash,6,4)}`;
        const next=Math.min(4,last.stage+1); $('#rg-stage').value=next; if($('#rg-op')) $('#rg-op').value=STAGE_OP[next];
      } else $('#rg-id-hint').textContent = id.value.trim()?'새 데이터셋으로 등록됩니다 (첫 단계 parentHash = 0x0)':'';
    };
    id.addEventListener('input',refresh);
    $('#rg-stage').addEventListener('change',e=>{ if($('#rg-op')) $('#rg-op').value=STAGE_OP[+e.target.value]; });
    const takeFile=async f=>{
      if(!f) return;
      $('#rg-file-name').textContent=`${f.name} · ${fmtBytes(f.size)} · 해시 계산 중…`;
      const h=await sha256Hex(await f.arrayBuffer());
      $('#rg-hash').value=h; S._rgFile={name:f.name,size:f.size};
      $('#rg-file-name').textContent=`${f.name} · ${fmtBytes(f.size)}`;
    };
    file.addEventListener('change',()=>takeFile(file.files[0]));
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');takeFile(e.dataTransfer.files[0])});
    const fillExample=async()=>{
      if (isLive()){
        id.value='DS-2026-0040'; refresh(); if(!S.records.has('DS-2026-0040')) $('#rg-name').value='민원 문서 요약 학습데이터';
        $('#rg-uri').value='s3://vy-data/DS-2026-0040/collect/manifest.json'; $('#rg-note').value='민원 문서 3,200건 수집 (예시)';
      } else {
        id.value='DS-2026-0024'; refresh();
        $('#rg-uri').value='s3://vy-data/DS-2026-0024/ai_process/manifest.json'; $('#rg-note').value='진동 패턴 이상탐지 모델 입력용 특징량 추출 (예시)';
      }
      $('#rg-hash').value=await sha256Hex('example-batch '+Date.now()+Math.random());
      S._rgFile={name:'example_batch.parquet',size:2184330}; $('#rg-file-name').textContent='example_batch.parquet · 2.08 MB (예시)';
    };
    $('#rg-example').onclick=fillExample;
    if (!isLive()) fillExample();
    $('#rg-form').onsubmit=async e=>{
      e.preventDefault(); const err=$('#rg-err'); err.hidden=true; const btn=$('#rg-submit');
      const input={ dataId:id.value, name:$('#rg-name').value.trim(), stage:+$('#rg-stage').value, contentHash:$('#rg-hash').value,
        operator:$('#rg-op')?.value, metaURI:$('#rg-uri').value.trim(), note:$('#rg-note').value.trim(), fileName:S._rgFile?.name, size:S._rgFile?.size };
      try{
        btn.disabled=true;
        const tx = isLive() ? await liveRegister(input) : submitRecord(input,'console');
        S.lastReceipt=tx.hash; S._rgFile=null;
        $('#rg-hash').value=''; $('#rg-file-name').textContent='파일을 끌어다 놓거나 클릭해서 선택'; file.value='';
        this.live(); toast('트랜잭션을 제출했습니다. 다음 블록에서 확정됩니다.');
      }catch(x){ err.textContent=x.message; err.hidden=false; }
      finally{ btn.disabled=false; }
    };
    this.live();
  },
  live(){
    const el=$('#rg-receipt'); if(!el || !S.lastReceipt) return;
    const t=getTx(S.lastReceipt); if(!t) return;
    const st = t.status==='pending' ? `<span class="chip warn"><span class="spinner"></span>블록 대기 중</span>` : t.status==='success' ? `<span class="chip ok">확정</span>` : t.status==='unknown' ? '<span class="chip"><span class="spinner"></span>확인 중</span>' : `<span class="chip crit">실패</span>`;
    setHTML(el, `<div class="kv">
      <div>상태</div><div>${st}</div>
      <div>트랜잭션</div><div>${txLink(t.hash)}${cp(t.hash)}</div>
      <div>블록</div><div>${blkLink(t.block)}${t.block!=null?` <span class="small muted">확인 ${fmt(S.height-t.block)}회</span>`:''}</div>
      <div>데이터</div><div>${esc(t.args.dataId)} ${stageChip(parseStage(t.args.stage))}</div>
      <div>콘텐츠 해시</div><div class="mono">${short(t.args.contentHash,10,8)}</div>
      <div>parentHash</div><div class="mono">${t.parentHash===ZERO?'0x0 (최초 단계)':short(t.parentHash,10,8)}</div>
      <div>가스</div><div class="mono">${t.gasUsed==null?'—':fmt(t.gasUsed)}</div></div>
      ${t.error?`<div class="err">${esc(t.error)}</div>`:''}
      ${t.status==='success'?`<div class="row">${goBtn('data:'+t.args.dataId,'이력 보기','btn ghost sm')}${goBtn('verifyhash:'+t.args.contentHash,'진위 검증','btn ghost sm')}</div>`:''}`);
  }
};

    el.innerHTML=`

VIEWS.verify = { title:'진위 검증', crumb:'계약 (2) 데이터 이력·진위검증',
  html(){
    return `${modeBanner()}${contractBanner()}

          <button class="btn" type="submit">검증</button>

          ${isLive()
            ? `<p class="small muted">샘플 CSV를 실제 메인넷에 등록해 두면 원본(일치)·위변조본(불일치)을 비교해 시연할 수 있습니다. 위변조본은 계약금액 한 칸(48000000 → 84000000)만 다릅니다.</p>
               <div class="row">${S.hashIndex.has(S.sampleHash)?'':'<button type="button" class="btn ghost sm" id="vf-reg">샘플을 DS-DEMO-SAMPLE로 등록</button>'}<button type="button" class="btn ghost sm" id="vf-s1">원본 샘플로 검증</button><button type="button" class="btn ghost sm" id="vf-s2">위변조 샘플로 검증</button></div>`
            : `<p class="small muted">DS-2026-0031 품질 검증 단계에 등록된 CSV입니다. 위변조본은 계약금액 한 칸(48000000 → 84000000)만 다릅니다.</p>
               <div class="row"><button type="button" class="btn ghost sm" id="vf-s1">원본 샘플로 검증</button><button type="button" class="btn ghost sm" id="vf-s2">위변조 샘플로 검증</button></div>`}
          <details><summary class="small">샘플 내용 보기</summary><pre class="code short">${esc(SAMPLE_CSV)}</pre></details>

      <div class="stack">
        <div class="panel" id="vf-result"><h3>검증 결과</h3><p class="muted small">파일이나 해시를 넣고 검증하면 결과와 온체인 증빙이 표시됩니다.</p></div>

  mount(){

    $$('.tabs [data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    setMode(S.verifyPrefill?'hash':S.verifyMode);
    if (S.verifyPrefill){ $('#vf-hash').value=S.verifyPrefill; const pf=S.verifyPrefill; S.verifyPrefill=null; this.run(pf,'',null); }
    const drop=$('#vf-drop'), file=$('#vf-file');
    const take=async f=>{ if(!f) return; $('#vf-file-name').textContent=`${f.name} · 해시 계산 중…`; S._vfHash=await sha256Hex(await f.arrayBuffer()); S._vfName=f.name; $('#vf-file-name').textContent=`${f.name} · ${fmtBytes(f.size)}`; };
    file.addEventListener('change',()=>take(file.files[0]));

const SOL_SOURCE = `// SPDX-License-Identifier: UNLICENSED
pragma solidity ^0.8.24;

import {AccessControl} from "@openzeppelin/contracts/access/AccessControl.sol";

/// @title  DataProvenanceRegistry
/// @notice 데이터 수집·전처리·AI 가공 이력을 온체인에 기록하고 콘텐츠 해시로 진위를 검증한다.
/// @dev    원본 데이터는 저장하지 않는다. SHA-256 콘텐츠 해시와 메타데이터 URI만 기록한다.
contract DataProvenanceRegistry is AccessControl {
    bytes32 public constant REGISTRAR_ROLE = keccak256("REGISTRAR_ROLE");
    bytes32 public constant AUDITOR_ROLE   = keccak256("AUDITOR_ROLE");

    enum Stage { COLLECT, PREPROCESS, AI_PROCESS, QA, LICENSE }

    struct Record {
        bytes32 contentHash;   // 해당 단계 산출물의 SHA-256
        bytes32 parentHash;    // 직전 단계 contentHash (최초 단계는 0x0)
        Stage   stage;
        address registrar;
        uint64  timestamp;
        uint64  blockNumber;
        string  metaURI;       // 매니페스트 위치 (원본 데이터 아님)
    }

    struct AuditAnchor {
        bytes32 merkleRoot;
        uint64  fromSeq;
        uint64  toSeq;
        uint64  timestamp;
        address auditor;
    }

    mapping(bytes32 => Record[]) private _history;   // dataKey => 단계별 이력
    mapping(bytes32 => string)   private _dataIdOf;  // dataKey => dataId 원문
    mapping(bytes32 => bytes32)  private _keyOfHash; // contentHash => dataKey
    mapping(bytes32 => uint256)  private _indexOfHash;
    bytes32[] private _dataKeys;
    AuditAnchor[] private _anchors;
    uint256 public totalRecords;

    event RecordRegistered(
        bytes32 indexed dataKey,
        Stage   indexed stage,
        address indexed registrar,
        string  dataId,
        bytes32 contentHash,
        bytes32 parentHash,
        string  metaURI,
        uint64  timestamp
    );
    event AuditLogAnchored(
        uint256 indexed anchorId,
        address indexed auditor,
        bytes32 merkleRoot,
        uint64  fromSeq,
        uint64  toSeq,
        uint64  timestamp
    );

    error ZeroAddress();
    error EmptyDataId();
    error EmptyHash();
    error DuplicateHash(bytes32 contentHash);
    error InvalidStageOrder(Stage last, Stage next);
    error NotFound(bytes32 dataKey);
    error InvalidRange(uint64 fromSeq, uint64 toSeq);

    /// @param admin 관리자 주소. 초기 운영 편의를 위해 등록·감사 권한도 함께 부여한다.
    constructor(address admin) {
        if (admin == address(0)) revert ZeroAddress();
        _grantRole(DEFAULT_ADMIN_ROLE, admin);
        _grantRole(REGISTRAR_ROLE, admin);
        _grantRole(AUDITOR_ROLE, admin);
    }

    function keyOf(string memory dataId) public pure returns (bytes32) {
        return keccak256(bytes(dataId));
    }

    /// @notice 가공 단계 이력을 등록한다. 직전 단계 해시가 parentHash로 자동 연결된다.
    function registerRecord(string calldata dataId, Stage stage, bytes32 contentHash, string calldata metaURI)
        external
        onlyRole(REGISTRAR_ROLE)
    {
        if (bytes(dataId).length == 0) revert EmptyDataId();
        if (contentHash == bytes32(0)) revert EmptyHash();
        if (_keyOfHash[contentHash] != bytes32(0)) revert DuplicateHash(contentHash);

        bytes32 key = keccak256(bytes(dataId));
        Record[] storage h = _history[key];
        bytes32 parent;
        if (h.length == 0) {
            _dataKeys.push(key);
            _dataIdOf[key] = dataId;
        } else {
            Record storage last = h[h.length - 1];
            if (stage < last.stage) revert InvalidStageOrder(last.stage, stage);
            parent = last.contentHash;
        }

        h.push(Record(contentHash, parent, stage, msg.sender, uint64(block.timestamp), uint64(block.number), metaURI));
        _keyOfHash[contentHash] = key;
        _indexOfHash[contentHash] = h.length - 1;
        unchecked { totalRecords++; }

        emit RecordRegistered(key, stage, msg.sender, dataId, contentHash, parent, metaURI, uint64(block.timestamp));
    }

    /// @notice 콘텐츠 해시로 진위를 검증한다.
    function verify(bytes32 contentHash)
        external
        view
        returns (bool found, string memory dataId, uint256 index, Record memory record)
    {
        bytes32 key = _keyOfHash[contentHash];
        if (key == bytes32(0)) return (false, "", 0, record);
        index = _indexOfHash[contentHash];
        return (true, _dataIdOf[key], index, _history[key][index]);
    }

    function getHistory(string calldata dataId) external view returns (Record[] memory) {
        return _history[keccak256(bytes(dataId))];
    }

    function latest(string calldata dataId) external view returns (Record memory) {
        bytes32 key = keccak256(bytes(dataId));
        Record[] storage h = _history[key];
        if (h.length == 0) revert NotFound(key);
        return h[h.length - 1];
    }

    function datasetCount() external view returns (uint256) {
        return _dataKeys.length;
    }

    function datasetAt(uint256 i) external view returns (string memory dataId, uint256 records) {
        bytes32 key = _dataKeys[i];
        return (_dataIdOf[key], _history[key].length);
    }

    /// @notice 오프체인 감사 로그 묶음의 머클 루트를 기록한다.
    function anchorAuditLog(bytes32 merkleRoot, uint64 fromSeq, uint64 toSeq)
        external
        onlyRole(AUDITOR_ROLE)
    {
        if (fromSeq == 0 || toSeq < fromSeq) revert InvalidRange(fromSeq, toSeq);
        _anchors.push(AuditAnchor(merkleRoot, fromSeq, toSeq, uint64(block.timestamp), msg.sender));
        emit AuditLogAnchored(_anchors.length - 1, msg.sender, merkleRoot, fromSeq, toSeq, uint64(block.timestamp));
    }

    function auditAnchor(uint256 id) external view returns (AuditAnchor memory) {
        return _anchors[id];
    }

    function auditAnchorCount() external view returns (uint256) {
        return _anchors.length;
    }
}
`;
function highlightSol(src){
  const re=/(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(pragma|solidity|import|from|contract|is|function|external|view|pure|returns|return|if|else|revert|emit|event|error|struct|enum|mapping|public|private|constant|storage|memory|calldata|constructor|indexed|unchecked)\b|\b(bytes32|bytes|address|uint256|uint64|string|bool|Stage|Record|AuditAnchor)\b/gm;
  let out='', last=0, m;
  while((m=re.exec(src))){ out+=esc(src.slice(last,m.index)); const cls=m[1]?'k-com':m[2]?'k-str':m[3]?'k-kw':'k-ty'; out+=`<span class="${cls}">${esc(m[0])}</span>`; last=re.lastIndex; }
  return out+esc(src.slice(last));
}

  ['anchorAuditLog(bytes32 merkleRoot, uint64 fromSeq, uint64 toSeq)','쓰기','AUDITOR_ROLE','감사 로그 묶음의 머클 루트 기록'],

];

function resolvePath(def, vals){ return def.p.replace(/\{(\w+)\}/g,(_,k)=>encodeURIComponent(vals[k]??'')); }
function apiRoute(method, path, body){
  const u=new URL(path,'https://x'); const p=u.pathname; const q=u.searchParams; let m;
  const ok=(b,s=200)=>({status:s,body:b});
  if (method==='GET' && p==='/network/status'){
    const v=VALS().filter(n=>!n.down).length;
    return ok({ chainId:+SET.chainId, blockNumber:S.height, peerCount:S.nodes.filter(n=>!n.down).length-1, syncing:false,
      contract:{ address:SIM_CONTRACT, deployed:true, totalRecords:allEntries().length, datasetCount:S.records.size }, validators:{ total:4, online:v } });
  }
  if (method==='GET' && p==='/records') return ok({ total:S.records.size, items:[...S.records.values()].map(r=>({ dataId:r.dataId, name:r.name, records:r.entries.length })) });
  if (method==='POST' && p==='/records'){
    if (!body || typeof body!=='object') throw E(400,'INVALID_REQUEST','요청 본문은 JSON 객체여야 합니다.');
    const tx=submitRecord(body,'api');
    return ok({ txHash:tx.hash, status:'PENDING', dataId:tx.args.dataId, stage:tx.args.stage, contentHash:tx.args.contentHash, submittedAt:new Date(tx.time).toISOString() },202);
  }
  if (method==='GET' && (m=p.match(/^\/records\/([^/]+)$/))){
    const r=S.records.get(decodeURIComponent(m[1])); if(!r) throw E(404,'NOT_FOUND','해당 데이터 ID의 이력이 없습니다.');
    const l=r.entries[r.entries.length-1];
    return ok({ dataId:r.dataId, name:r.name, currentStage:STAGES[l.stage].key, latestHash:l.contentHash, entries:r.entries.length, lastBlock:l.block, updatedAt:new Date(l.time).toISOString() });
  }
  if (method==='GET' && (m=p.match(/^\/records\/([^/]+)\/history$/))){
    const r=S.records.get(decodeURIComponent(m[1])); if(!r) throw E(404,'NOT_FOUND','해당 데이터 ID의 이력이 없습니다.');
    return ok({ dataId:r.dataId, name:r.name, chainIntegrity:chainIntegrity(r).ok?'VALID':'BROKEN',
      history:r.entries.map((e,i)=>({ index:i, stage:STAGES[e.stage].key, contentHash:e.contentHash, parentHash:e.parentHash, registrar:ACC[e.operator]?.addr||e.operator, block:e.block, timestamp:new Date(e.time).toISOString(), metaURI:e.metaURI||'', note:e.note||null })) });
  }
  if (method==='POST' && p==='/verify'){
    if (!body || !body.contentHash) throw E(400,'INVALID_HASH','contentHash가 필요합니다.');
    const r=verifyHash(body.contentHash, body.dataId||'', 'API 클라이언트');
    const o={ result:r.status, contentHash:r.hash };
    if (r.status==='MATCH') Object.assign(o,{ dataId:r.dataId, stage:STAGES[r.entry.stage].key, isLatest:r.isLatest, block:r.entry.block, confirmations:r.height-r.entry.block, timestamp:new Date(r.entry.time).toISOString() });
    if (r.status==='MISMATCH') Object.assign(o,{ dataId:r.dataId, expectedLatestHash:r.expected.contentHash, expectedStage:STAGES[r.expected.stage].key });
    o.checkedAtBlock=r.height; return ok(o);
  }
  if (method==='GET' && (m=p.match(/^\/transactions\/(0x[0-9a-fA-F]{64})$/))){
    const t=getTx(m[1].toLowerCase()); if(!t) throw E(404,'NOT_FOUND','트랜잭션을 찾을 수 없습니다.');
    return ok({ txHash:t.hash, status:t.status.toUpperCase(), block:t.block, confirmations:t.block==null?0:S.height-t.block, from:t.from, to:t.to, method:t.method, args:t.args, gasUsed:t.gasUsed });
  }
  if (method==='GET' && p==='/audit-logs'){
    const lim=Math.min(100,+(q.get('limit')||20)); const ty=q.get('type');
    const list=S.audit.filter(a=>!ty||a.type===ty).slice(-lim).reverse();
    return ok({ total:S.audit.length, items:list.map(a=>({ seq:a.seq, ts:a.time, type:a.type, actor:a.actor, action:a.action, target:a.target, result:a.result, tx:a.tx })) });
  }
  if (method==='GET' && p==='/audit-anchors') return ok({ anchorSize:ANCHOR_SIZE, items:STORES.sim.anchors.map(a=>({ anchorId:a.id, fromSeq:a.fromSeq, toSeq:a.toSeq, root:a.root, txHash:a.txHash, block:a.block })) });
  throw E(404,'NOT_FOUND','지원하지 않는 엔드포인트입니다.');
}
function mockApi(method, path, body){
  let res;
  try { res=apiRoute(method, path, body); } catch(x){ res={ status:x.status||500, body:{ error:{ code:x.code||'INTERNAL', message:x.message } } }; }
  if (!(method==='POST' && path==='/verify')) audit('API','API 클라이언트(모의)',`${method} /v1${path}`, '', String(res.status));
  return { ...res, ms: 6+(Math.random()*28|0), mock:true };
}
async function realApi(method, path, body){
  const t0=performance.now();
  const r = await fetch(SET.api+path, { method, headers:{ 'X-API-Key':SET.apiKey, ...(body?{ 'Content-Type':'application/json' }:{}) }, body: body?JSON.stringify(body):undefined });
  let j; try { j=await r.json(); } catch(_){ j={ error:{ code:'NON_JSON', message:'JSON이 아닌 응답' } }; }
  return { status:r.status, body:j, ms:Math.round(performance.now()-t0) };
}
