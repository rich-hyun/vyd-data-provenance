# 경보 전달 설정. 아래 receivers 의 주석을 풀고 실제 값을 넣으세요.
route:
  receiver: ops
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [ 'severity="info"' ]
      receiver: silent
    - matchers: [ 'severity="critical"' ]
      receiver: ops
      repeat_interval: 30m

inhibit_rules:
  # RPC가 죽으면 블록 정지 경보는 중복이므로 묶어서 보냄
  - source_matchers: [ 'alertname="VydRpcDown"' ]
    target_matchers: [ 'alertname="VydBlockProductionStalled"' ]

receivers:
  - name: silent
  - name: ops
    # 메일
